services:
  fnos-fan-webui:
    # Pin a tested release. Change to :latest only after you have read the update notes.
    image: ghcr.io/wwu-unique/fnos-fan-webui:1.0.0
    # To build locally instead, uncomment the next line and remove `image:`.
    # build: .
    container_name: fnos-fan-webui
    restart: unless-stopped
    privileged: true # Required to write the host PWM hwmon node.
    ports:
      - "8080:8080"
    volumes:
      # Required: exposes qnap8528 pwm1/fan1_input and board sensors to the container.
      - /sys/class/hwmon:/sys/class/hwmon:rw
      # Persistent fan-curve configuration, history, and optional disk temperatures.
      - ./data:/data
    environment:
      - TZ=Asia/Shanghai

# SECURITY: do not expose port 8080 to the public Internet. Put it behind an
# authenticated reverse proxy or limit it to a trusted LAN.
# COMPATIBILITY: the image alone cannot add qnap8528 support. The host must already
# expose /sys/class/hwmon/*/name=qnap8528 with pwm1 and fan1_input.
